plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystore = rootProject.file('signingkey.jks')

android {
    namespace 'eu.kanade.tachiyomi.animeextension.en.hentaitubeonline'
    compileSdk 34

    defaultConfig {
        applicationId 'eu.kanade.tachiyomi.animeextension.en.hentaitubeonline'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '14.1'
    }

    signingConfigs {
        release {
            storeFile keystore
            storePassword System.getenv('KEY_STORE_PASSWORD')
            keyAlias System.getenv('ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystore.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "aniyomi-en.hentaitubeonline-v${variant.versionName}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    compileOnly 'com.github.aniyomiorg:extensions-lib:14'
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    compileOnly 'org.jsoup:jsoup:1.16.1'
    compileOnly 'com.squareup.okhttp3:okhttp:5.0.0-alpha.11'
}
